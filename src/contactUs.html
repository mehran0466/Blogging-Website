<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Blogging Website</title>
    <link rel="stylesheet" href="/styles/contactUs.css">
</head>
<body>
    <header>
        <h1 id="contact-title">Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html" id="home-link">Home</a></li>
                <li><a href="blog.html" id="blog-link">Blog</a></li>
                <li><a href="contact.html" id="contact-link">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact-form">
            <h2>Get in Touch</h2>
            <form action="submit-contact-form" method="post" id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit" id="submit-button">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Blogging Website. All rights reserved.</p>
    </footer>
</body>
</html>
